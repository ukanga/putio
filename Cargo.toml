[package]
name = "putio"
version = "0.2.0"
authors = ["Ukang'a Dickson <ukanga@users.noreply.github.com>"]
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
