name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The same toolchain the Dockerfile builds with, so a clippy lint or a
      # formatting rule cannot pass here and fail the image build.
      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy with the keyring feature
        run: cargo clippy --locked --all-targets --features keyring -- -D warnings

      - name: Run tests with the keyring feature
        run: cargo test --locked --features keyring
